<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGA - Museu da Pessoa</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
        AFRAME.registerComponent('hd-handler', {
            schema: { hdId: {type: 'string'} },
            init: function () {
                this.el.addEventListener('click', () => {
                    window.location.href = `Mapas_HTML/${this.data.hdId}.html`;
                });
            }
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;" 
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable">

        <a-marker type="pattern" url="Marcadores/pattern_HD_0001.patt">
            <a-entity 
                class="clickable" 
                hd-handler="hdId: HD_0001"
                position="0 0 0" 
                rotation="-90 0 0"
                animation="property: position; from: 0 0 0; to: 0 0.2 0; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine">
                
                <a-plane width="2.8" height="1.6" color="#1a1a1a" opacity="0.9">
                    <a-plane position="0 0.75 0.01" width="2.8" height="0.1" color="#ffcc00"></a-plane>
                    <a-text value="ACERVO DIGITAL" position="-1.2 0.4 0.02" width="3" color="#ffcc00"></a-text>
                    <a-text value="HD_0001" position="-1.2 0.1 0.02" width="6" color="#ffffff"></a-text>
                    
                    <a-entity position="0 -0.4 0.02">
                        <a-plane width="2.4" height="0.4" color="#ffcc00">
                            <a-text value="TOQUE PARA EXPLORAR" align="center" color="#000" width="3.5"></a-text>
                        </a-plane>
                    </a-entity>
                </a-plane>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
