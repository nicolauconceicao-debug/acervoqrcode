<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>AR Interativo - Museu da Pessoa</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css">

    <script>
        // Lógica Global de Redirecionamento
        AFRAME.registerComponent('hd-handler', {
            schema: {
                hdId: {type: 'string'}
            },
            init: function () {
                let el = this.el;
                let data = this.data;
                let lastClickTime = 0;

                el.addEventListener('click', function () {
                    let currentTime = new Date().getTime();
                    if (currentTime - lastClickTime > 500) {
                        // Redireciona dinamicamente para o mapa do HD correspondente
                        window.location.href = `Mapas_HTML/${data.hdId}.html`;
                    }
                    lastClickTime = currentTime;
                });
            }
        });
    </script>
</head>

<body>
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;" 
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable">

        <a-marker type="pattern" url="marcadores/pattern_HD_0001.patt">
            <a-plane class="clickable" hd-handler="hdId: HD_0001" position="0 0.5 0" rotation="-90 0 0" width="2.5" height="1.5" color="#0055ff" opacity="0.9">
                <a-text value="HD_0001\nTOQUE PARA ABRIR" align="center" position="0 0 0.1" width="4"></a-text>
            </a-plane>
        </a-marker>

        <a-marker type="pattern" url="marcadores/pattern_HD_0002.patt">
            <a-plane class="clickable" hd-handler="hdId: HD_0002" position="0 0.5 0" rotation="-90 0 0" width="2.5" height="1.5" color="#0055ff" opacity="0.9">
                <a-text value="HD_0002\nTOQUE PARA ABRIR" align="center" position="0 0 0.1" width="4"></a-text>
            </a-plane>
        </a-marker>

        <a-marker type="pattern" url="marcadores/pattern_HD_0003.patt">
            <a-plane class="clickable" hd-handler="hdId: HD_0003" position="0 0.5 0" rotation="-90 0 0" width="2.5" height="1.5" color="#0055ff" opacity="0.9">
                <a-text value="HD_0003\nTOQUE PARA ABRIR" align="center" position="0 0 0.1" width="4"></a-text>
            </a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
