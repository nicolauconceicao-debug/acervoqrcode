<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Acervo - Museu da Pessoa</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="css/scanner_style.css">
</head>
<body>

    <div id="reader"></div>

    <div class="camera-guidelines">
            <div class="scan-box">
                <span class="corner top-left"></span>
                <span class="corner top-right"></span>
                <span class="corner bottom-left"></span>
                <span class="corner bottom-right"></span>
                
                <div class="scan-line"></div>
            </div>
            <p class="status-msg">Aponte para o QR Code do HD</p>
        </div>
                <div id="reticulo-foco" class="scanner-box hidden"></div>
                <p class="status-msg"></p>
            </div>

            <div class="action-buttons">
                <button class="secondary-btn" id="add-to-basket">
                    <span>ᯓ★</span> Salvar na Cesta
                </button>
                
                <button class="primary-btn" id="go-to-map">
                    EXPLORAR MAPA <span>→</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/scanner_logic.js"></script>
</body>
</html>
