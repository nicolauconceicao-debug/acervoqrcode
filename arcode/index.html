<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Acervo - Museu da Pessoa</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="css/scanner_style.css">
</head>
<body>

    <div id="reader"></div>

    <div class="camera-guidelines">
        <div class="scanner-box"></div>
        <p class="status-msg">Aponte para o QR Code do HD</p>
    </div>

    <div id="info-sheet" class="sheet">
        <div class="sheet-header">
            <div class="drag-handle"></div>
            <button id="close-btn">✕</button>
        </div>
        
        <div class="sheet-body">
            <div class="header-info">
                <span class="badge">HD ENCONTRADO</span>
                <h1 id="hd-title">Carregando...</h1>
                <p id="hd-id-tag">ID: --</p>
            </div>

            <div class="json-details">
                <div class="info-row">
                    <span>Projeto:</span>
                    <strong id="val-projeto">...</strong>
                </div>
                <div class="info-row">
                    <span>Status:</span>
                    <strong id="val-status" style="color: #00ff00;">Online</strong>
                </div>
            </div>

            <div class="action-buttons">
                <button class="secondary-btn" id="add-to-basket">
                    <span>⭐</span> Salvar na Cesta
                </button>
                
                <button class="primary-btn" id="go-to-map">
                    EXPLORAR MAPA <span>→</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/scanner_logic.js"></script>
</body>
</html>
