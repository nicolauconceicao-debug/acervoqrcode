<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Museu da Pessoa</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <link rel="stylesheet" href="css/ar_style.css">
    <script src="js/js_ar_logic.js"></script>
</head>

<body>
    <div class="ar-overlay">
        <h2 class="ar-title">Museu da Pessoa</h2>
        <span class="ar-instruction">Aponte para o marcador do HD</span>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <a-marker type="pattern" url="marcadores/hd_0001.patt">
            <a-entity position="0 0.2 0" rotation="-90 0 0">
                
                <a-plane class="clickable" 
                         ar-card-logic="hdId: hd_0001; jsonPath: ../base_dados/hd_0001/hd_0001_step3.json"
                         width="3.5" height="2.2" color="#111">
                    
                    <a-plane position="0 1.05 0.02" width="3.5" height="0.1" color="#ffcc00"></a-plane>
                    
                    <a-text class="lbl-nome" value="Carregando..." position="-1.6 0.6 0.05" width="4.5"></a-text>
                    <a-text class="lbl-extra" value="..." position="-1.6 0.3 0.05" width="3" color="#aaa"></a-text>

                    <a-entity position="0 -0.7 0.1">
                        <a-plane width="3" height="0.5" color="#ffcc00">
                            <a-text value="EXPLORAR ACERVO" align="center" color="#000" width="4"></a-text>
                        </a-plane>
                    </a-entity>
                </a-plane>

            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
