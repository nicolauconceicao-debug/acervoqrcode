<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
        AFRAME.registerComponent('hd-handler', {
            schema: { hdId: {type: 'string'} },
            init: function () {
                this.el.addEventListener('click', () => {
                    alert("Clicou no " + this.data.hdId);
                    window.location.href = `Mapas_HTML/${this.data.hdId}.html`;
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" color="#ffcc00" class="clickable" hd-handler="hdId: HD_0001"></a-box>
            <a-text value="TESTE HIRO - CLIQUE AQUI" align="center" rotation="-90 0 0" position="0 1 0"></a-text>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
